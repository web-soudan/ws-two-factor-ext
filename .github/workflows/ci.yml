name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpcs:
    name: phpcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction
      - run: composer run phpcs

  phpunit:
    name: "PHPUnit (WP ${{ matrix.wp }} / PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: latest
            php: '8.4'
          - wp: '6.8'
            php: '8.3'
          - wp: '6.8'
            php: '8.4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli
      - name: Reinstall Composer dependencies (with dev)
        run: |
          rm -rf vendor
          composer install --no-interaction
      - name: Install WordPress test suite
        # MYSQL_DATABASE で DB が自動生成されているため SKIP_DB_CREATE=true を渡す。
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }} true
      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: vendor/bin/phpunit --bootstrap tests/phpunit/bootstrap.php

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    # plugin-check-action が最新 @wordpress/env と非互換のため continue-on-error。
    # action 側が修正されるまで結果は参考扱いとする。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # plugin-check-action は .wp-env.json に追記するため削除してから渡す。
      - name: Remove local .wp-env.json for plugin-check
        run: rm -f .wp-env.json
      - uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: 'vendor,tests,node_modules'
          categories: |
            general
            performance
            accessibility
            security
          ignore-warnings: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: npm ci
      - run: composer install --no-interaction
      - run: npx playwright install chromium --with-deps
      - name: Start wp-env
        run: npx wp-env start
      - name: Run E2E tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
